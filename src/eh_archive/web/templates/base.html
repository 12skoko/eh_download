<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}EH Archive控制台{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-boost="true">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">EH</span>
      <span><strong>EH Archive</strong><small>归档控制台</small></span>
    </a>
    <nav aria-label="主导航">
      <a class="{{ 'active' if request.url.path == '/' else '' }}" href="/">总览</a>
      <a class="{{ 'active' if request.url.path.startswith('/manga') else '' }}" href="/manga">档案队列</a>
      <a class="{{ 'active' if request.url.path == '/review' else '' }}" href="/review">人工复核</a>
      <a class="{{ 'active' if request.url.path.startswith('/special') else '' }}" href="/special">特殊处理</a>
      <a class="{{ 'active' if request.url.path == '/events' else '' }}" href="/events">事件与错误</a>
      <a class="{{ 'active' if request.url.path.startswith('/logs') else '' }}" href="/logs" hx-boost="false">日志</a>
      <a class="{{ 'active' if request.url.path == '/config' else '' }}" href="/config">配置</a>
      <a class="{{ 'active' if request.url.path.startswith('/system') else '' }}" href="/system"><span>系统<span class="update-dot" data-update-dot hidden role="img" aria-label="有新更新" title="有新更新"></span></span></a>
    </nav>
    <form action="/logout" method="post" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <span class="user">{{ identity.username }}</span>
      <button class="link-button" type="submit">退出</button>
    </form>
  </header>
  <main id="main" class="shell">
    {% block content %}{% endblock %}
  </main>
  <template id="system-operation-shell">
    {% include "_system_operation_body.html" %}
  </template>
</body>
</html>
