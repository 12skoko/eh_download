{% from "uiv3/_macros.html" import icon with context %}
<div class="note" data-tone="danger" role="alert" data-status="{{ status_code_value }}">{{ icon('circle-alert') }}
  <div class="grow"><strong>操作没有完成</strong><div class="xs" style="margin-top:2px">{{ message }}</div>
    {% if status_code_value == 409 %}<div class="xs" style="margin-top:6px">记录可能已被 Supervisor 或其他页面修改。<button type="button" class="btn btn-sm" data-refresh-region style="margin-left:6px">{{ icon('refresh-cw', 'icon-sm') }}刷新到最新状态</button></div>{% endif %}
  </div>
</div>
