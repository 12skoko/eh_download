{% extends "base.html" %}
{% block title %}档案队列 ▪ EH Archive控制台{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">档案管理</p><h1>档案队列</h1></div></div>
<form id="manga-filter-form" class="filter-panel" method="get" action="/manga"
      hx-get="/manga" hx-target="#manga-results" hx-swap="outerHTML"
      hx-push-url="true" hx-sync="this:replace" data-auto-filter-form>
  <label class="grow">搜索<input name="q" value="{{ q }}" placeholder="标题、文件名或 manga ID" data-debounced-search></label>
  <label>来源<select name="queue_source"><option value="">全部</option><option value="automatic" {{ 'selected' if queue_source == 'automatic' }}>自动</option><option value="manual" {{ 'selected' if queue_source == 'manual' }}>人工</option></select></label>
  <label>错误<select name="has_error"><option value="">全部</option><option value="yes" {{ 'selected' if has_error == 'yes' }}>有错误</option><option value="no" {{ 'selected' if has_error == 'no' }}>无错误</option></select></label>
  <label>每页<select name="limit"><option {{ 'selected' if limit == 25 }}>25</option><option {{ 'selected' if limit == 50 }}>50</option><option {{ 'selected' if limit == 100 }}>100</option></select></label>
  <button class="primary" type="submit">筛选</button>
  <div class="status-filter">
    {% for status, label in status_labels.items() %}<label><input type="checkbox" name="status" value="{{ status }}" {{ 'checked' if status in selected_statuses }}><span>{{ label }}</span></label>{% endfor %}
  </div>
</form>
{% include "_manga_results.html" %}
{% endblock %}
