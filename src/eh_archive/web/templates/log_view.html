{% extends "base.html" %}
{% block title %}查看日志 ▪ EH Archive控制台{% endblock %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">日志文件</p><h1>查看日志</h1><p class="mono" style="overflow-wrap:anywhere">{{ filename }}</p></div></div>
<div id="log-viewer" data-file="{{ filename }}">
<div class="filter-panel">
<a class="button" href="/logs?{{ directory_query }}" hx-boost="false">返回所在目录</a>
<button type="button" data-earlier disabled>更早内容</button>
<button type="button" data-latest>最新内容</button>
<label class="check"><input type="checkbox" data-auto>每 5 秒刷新</label>
<label class="check"><input type="checkbox" data-follow checked>跟随底部</label>
<a class="button primary" href="/api/logs/download?file={{ file_query }}" hx-boost="false">下载完整日志</a>
</div>
<p>每次显示最多 64 KiB 原始内容；查看更早内容会暂停自动刷新。下载保留原文，未做脱敏。</p>
<p data-log-status role="status" aria-live="polite">正在读取…</p>
<pre class="log-content" data-log-content tabindex="0" aria-label="日志内容"></pre>
</div>
<script src="/static/logs.js" defer></script>
{% endblock %}
