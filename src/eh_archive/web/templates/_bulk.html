{% from "_macros.html" import icon, modal_head with context %}
<div class="bulkbar" data-bulkbar hidden role="region" aria-label="批量操作">
  <span>已选 <strong data-bulk-count>0</strong> 条（本页）</span>
  <button type="button" class="btn btn-primary" data-bulk-open>{{ icon('square-pen') }}批量更改状态</button>
  <button type="button" class="btn btn-ghost" data-bulk-clear>清除选择</button>
</div>
<dialog class="modal" id="bulk-dialog">
  <form data-bulk-form hx-boost="false">
    {{ modal_head('批量更改状态', none, 'list-checks') }}
    <div class="modal-body">
      <div data-bulk-fields class="form-stack">
        <p>将修改 <strong data-bulk-dialog-count>0</strong> 条档案。活动任务和版本冲突会逐条报错，其他档案继续处理；已处于目标状态的档案跳过。仅处理本页勾选，翻页或筛选后清空选择。</p>
        <div class="field"><label for="bulk-target">目标状态<span class="req">*</span></label>
          <select class="select status-tone" id="bulk-target" name="target_status" required data-bulk-target>
            <option value="">请选择</option>
            {% for target in bulk_status_targets %}<option value="{{ target.status }}" class="status-tone" data-tone="{{ target.status|ui_tone }}" data-requires-reason="{{ 'yes' if target.requires_reason else 'no' }}" data-default-reason="{{ target.default_reason|default('') }}" data-description="{{ target.description }}">{{ target.label }} · {{ target.status }}</option>{% endfor %}
          </select>
          <span class="help" data-bulk-description></span></div>
        <div class="field" data-bulk-replacement hidden><label>替代档案 ID<span class="req">*</span></label><input class="input mono" name="superseded_by_id" placeholder="最新档案 ID，例如 123456/token" disabled><span class="help">全部选中档案将关联到这个最新档案。</span></div>
        <div class="field" data-bulk-method hidden><label>统一下载方式<span class="req">*</span></label><select class="select" name="download_method" disabled><option value="">请选择</option>{% for method in ['torrent', 'direct', 'hah', 'aria2'] %}<option value="{{ method }}">{{ method }}</option>{% endfor %}<option value="manual_torrent">手动选择种子（每个档案独立进入，暂不加载）</option></select></div>
        <div class="field"><label data-bulk-reason-label>公共原因（可选）</label><textarea class="textarea" name="reason" rows="3" maxlength="4000"></textarea></div>
      </div>
      <div data-bulk-results hidden class="form-stack">
        <div class="note" data-tone="info">{{ icon('list-checks') }}<div data-bulk-summary></div></div>
        <ul class="bulk-list" data-bulk-list></ul>
      </div>
      <p class="small muted" data-bulk-message role="status"></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close-dialog data-bulk-phase="edit">取消</button>
      <button type="submit" class="btn btn-primary" data-bulk-phase="edit">确认修改</button>
      <button type="button" class="btn btn-primary" data-close-dialog data-bulk-phase="done" hidden>完成</button>
    </div>
  </form>
</dialog>
