<dl><dt>操作</dt><dd id="operation-kind">{{ operation.kind if operation else '' }}</dd>
  <dt>发起者</dt><dd id="operation-actor">{{ operation.actor if operation else '' }}</dd>
  <dt>状态</dt><dd id="operation-status">{{ operation.status if operation else '' }}</dd>
  <dt>当前阶段</dt><dd id="operation-phase">{{ operation.phase if operation else '' }}</dd>
  <dt>等待时间</dt><dd id="operation-elapsed"></dd>
  <dt>版本</dt><dd id="operation-commits"></dd>
</dl>
<p><a id="operation-new-address" hidden>新 Web 地址</a></p>
<button type="button" id="cancel-drain" hidden>取消 drain</button>
<p id="operation-error" role="alert"></p>
<h2>配置发布</h2><pre id="operation-configuration"></pre>
<h2>步骤</h2><pre id="operation-events"></pre>
<h2>日志</h2><pre id="operation-log">{{ operation.log if operation else '' }}</pre>
