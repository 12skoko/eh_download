poll_seconds = 5
collect_interval_seconds = 10800
batch_size = 10
direct_download_batch_size = 1
lease_seconds = 900
retry_limit = 5
torrent_stall_seconds = 604800
torrent_poll_seconds = 60
module_restart_delay_seconds = 5
request_timeout_seconds = 30
shutdown_grace_seconds = 30
thumbnail_interval_seconds = 900
