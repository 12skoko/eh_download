# Copy to secrets.toml and protect the file. Environment variables are also supported.
database_url = "postgresql+psycopg://user:password@localhost/eh_archive"
web_secret = "replace-me"

[accounts.default]
# Paste the browser Cookie header directly. Semicolons separate cookies.
cookies_str = "igneous=replace-me;ipb_member_id=replace-me;sl=dm_2;sk=replace-me;ipb_pass_hash=replace-me"

[networks.direct]
