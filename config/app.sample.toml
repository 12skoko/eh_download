database_url = "postgresql+psycopg://localhost/eh_archive"
timezone = "Asia/Shanghai"
log_level = "INFO"
log_dir = "D:/eharchive-data/log"
max_file_size = 21474836480
# Files at or above this size are reserved for the future filesystem-based
# LANraragi import path and are left in upload_pending for now. Set to 0 to
# disable this reservation and use normal HTTP upload for every file.
large_upload_threshold_bytes = 2147483648
web_host = "127.0.0.1"
web_port = 8787
qbittorrent_url = "http://127.0.0.1:8080"
# Absolute path as seen by the qBittorrent host. It may differ from the local
# roots.torrent_download path when qBittorrent runs on another machine.
qbit_torrent_path = "D:/eharchive-data/torrent_download"
lanraragi_url = "http://127.0.0.1:3000"
aria2_enabled = false
hah_enabled = false
fallback_method = "direct"
# Minimum seconds between completed external web requests in one worker.
# This applies to EH web/archive requests, not LANraragi or qBittorrent.
external_request_delay_seconds = 5.0
# E-Hentai/ExHentai network request retry policy.
eh_request_retry_limit = 5
eh_request_retry_delay_seconds = 10.0
# Cool down only the affected module after all E-Hentai requests fail.
# Set to 0 to disable cooldown and drain/stop the Supervisor instead.
eh_unavailable_cooldown_seconds = 21600

[sessions.browse]
account = "default"
network = "direct"

[sessions.archive]
account = "default"
network = "direct"

[roots]
# Every value must be an absolute directory on the machine that runs EH Archive.
torrent_download = "D:/eharchive-data/torrent_download"
hah_download = "D:/eharchive-data/hah_download"
direct_download = "D:/eharchive-data/direct_download"
aria2_download = "D:/eharchive-data/aria2_download"
prepared = "D:/eharchive-data/prepared"
quarantine = "D:/eharchive-data/quarantine"
trash = "D:/eharchive-data/trash"
