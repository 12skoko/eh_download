config_version = 1
# Copy this file to config/secrets.toml and protect the local file.
database_url = "postgresql+psycopg://user:password@localhost/eh_archive"
web_secret = "replace-with-at-least-32-random-characters"
web_username = "admin"
# Generate with: eharchive web-password
web_password_hash = "scrypt$replace-me"

[accounts.default]
# Paste the browser Cookie header directly. Semicolons separate cookies.
cookies_str = "igneous=replace-me;ipb_member_id=replace-me;sl=dm_2;sk=replace-me;ipb_pass_hash=replace-me"

[networks.direct]
# proxies = { http = "http://user:pass@host:port", https = "http://user:pass@host:port" }

# Full collection example: replace names/credentials and uncomment locally.
# [accounts.full_collection]
# cookies_str = "ipb_member_id=...;ipb_pass_hash=...;igneous=..."
# [networks.collection_pool]
# proxy_pool = ["collection_ip_1", "collection_ip_2"]
# [networks.collection_ip_1]
# proxies = { http = "http://host1:port", https = "http://host1:port" }
# [networks.collection_ip_2]
# proxies = { http = "http://host2:port", https = "http://host2:port" }
# app.toml [sessions.full_collect] references full_collection / collection_pool.

[networks.archive]
# Keep the archive account on its fixed network/proxy. The optional aria2
# table is passed directly to the aria2 JSON-RPC client.
# proxies = { http = "http://user:pass@host:port", https = "http://user:pass@host:port" }

[networks.archive.aria2]
# host = "http://127.0.0.1:6800/rpc"
# secret = ""

[qbittorrent]
host = "http://127.0.0.1:8080"
username = ""
password = ""

[lanraragi]
Authorization = "Bearer replace-me"

[lanraragi_smb]
username = "replace-me"
password = "replace-me"
