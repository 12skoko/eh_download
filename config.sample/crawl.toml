config_version = 1
observation_days = 1
collect_end_days = 6
collect_end_offset = 3000
# Archive received HTML as .html.gz with one manifest.json per collection run.
# Applies to ordinary scheduled/CLI collect; relative paths use the working directory.
# Archive write failures warn and do not stop collection. Files are retained until removed.
collect_archive_enabled = false
collect_archive_dir = "data/collect_pages"
collect_tags = []
name_keywords = []
tag_keywords = []
# Exact namespace:name gate for EH discovered candidates; empty keeps old behavior.
screen_required_tags = []
screen_required_tags_mode = "all"
exclude_categories = []
video_markers = ["mp4", "video"]
excluded_resolutions = ["1280x", "800x", "1920x", "2560x"]
tag_translation_url = "https://github.com/EhTagTranslation/Database/releases/latest/download/db.text.json"

